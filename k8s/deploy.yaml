apiVersion: apps/v1
kind: Deployment

metadata:
  name: aks-demo-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: aks-demo-app

  template:
    metadata:
      labels:
        app: aks-demo-app

    spec:
      containers:
        - name: aks-demo-app
          image: acrdevvikram001.azurecr.io/aks-demo-app
          ports:
            - containerPort: 3000