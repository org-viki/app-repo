name: App CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test


  build-and-push:

    name: Build and Push Image
    runs-on: ubuntu-latest

    needs: test

    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -t acrdevvikram001.azurecr.io/aks-demo-app:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            acrdevvikram001.azurecr.io/aks-demo-app:${{ github.sha }}
        
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    environment: dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-dev
          cluster-name: aks-dev

      - name: Verify AKS connection
        run: |
          kubectl get nodes

      - name: Deploy Kubernetes resources
        run: |
          kubectl apply -f k8s/svc.yaml
          kubectl apply -f k8s/deploy.yaml

      # - name: Update image
      #   run: |
      #     kubectl set image deployment/aks-demo-app \
      #       aks-demo-app=acrdevvikram001.azurecr.io/aks-demo-app:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/aks-demo-app          